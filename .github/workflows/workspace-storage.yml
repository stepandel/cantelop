name: Workspace storage policy

on:
  pull_request:
    paths: &policy-paths
      - 'storage/juicefs/**'
      - 'fire-fuse/host/nfs/**'
      - 'platform/ansible/roles/**'
      - 'go.mod'
      - 'go.sum'
      - 'platform/ansible/tests/test_juicefs_gateway_role.py'
      - '.github/workflows/workspace-storage.yml'
  # PR caches are scoped to refs/pull/N/merge and invisible to other PRs.
  # Runs on main seed the caches every PR can restore.
  push:
    branches: [main]
    paths: *policy-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check runtime and provisioning policy
        run: |
          go test ./fire-fuse/host/nfs ./fire-fuse/host/preflight ./fire-fuse/runtime/supervisor
          python3 -m unittest discover -s platform/ansible/tests

  juicefs:
    # Hosted binary qualification remains in the private operational repository.
    if: github.repository_id == '1323478043'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The script pins the upstream revision, source checksum and builder
      # digest, so the patched binary is a pure function of these two files.
      # hashFiles is only available inside steps, not in job-level env.
      - id: inputs
        run: echo "key=${{ hashFiles('storage/juicefs/prepare-juicefs-linux-amd64.sh', 'storage/juicefs/workspace-data-only.patch') }}" >> "$GITHUB_OUTPUT"
      # A hit means these exact inputs already built and passed the policy tests.
      - id: verified
        uses: actions/cache@v4
        with:
          path: dist/juicefs-linux-amd64.build-info
          key: juicefs-verified-linux-amd64-${{ steps.inputs.outputs.key }}
      # The Go build cache is ~900MB; saving it from every PR evicts the whole
      # 10GB repo quota. Only main saves it; PRs restore the nearest one.
      - if: steps.verified.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: dist/.juicefs-build-cache
          key: juicefs-build-linux-amd64-${{ steps.inputs.outputs.key }}
          restore-keys: juicefs-build-linux-amd64-
      - name: Build and test pinned JuiceFS policy
        if: steps.verified.outputs.cache-hit != 'true'
        run: ./storage/juicefs/prepare-juicefs-linux-amd64.sh
      - if: steps.verified.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: dist/.juicefs-build-cache
          key: juicefs-build-linux-amd64-${{ steps.inputs.outputs.key }}
