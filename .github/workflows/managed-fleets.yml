name: Managed Fleets
on:
  pull_request:
    paths: &fleet-paths
      - "console/**"
      - "fire-fuse/**"
      - "clients/cli/**"
      - "platform/systemd/compute/**"
      - "scripts/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/managed-fleets.yml"
  push:
    branches: [main]
    paths: *fleet-paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cantelop_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CANTELOP_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cantelop_test
      CANTELOP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cantelop_test
      CANTELOP_DATABASE_SSL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: console/package.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bun install --frozen-lockfile
        working-directory: console
      - name: Apply fresh control and observability migrations
        working-directory: console
        run: |
          bun run db:migrate
          bun run observability:db:migrate
      - run: bun run typecheck
        working-directory: console
      - run: bun test
        working-directory: console
      - name: Architecture and CLI API contracts
        run: |
          python3 scripts/check-architecture.py
          python3 scripts/check-cli-api-contract.py
      - name: Runtime, gateway, storage and CLI contracts
        run: go test ./fire-fuse/... ./clients/cli/...
      - name: Build managed Linux entry points
        run: CGO_ENABLED=0 go build -o /tmp/managed-binaries/ ./fire-fuse/runtime/cmd/fire-fuse ./fire-fuse/runtime/cmd/fire-fuse-managed-watchdog
      - run: python3 -m unittest discover -s scripts/tests -p test_release_qualification.py
