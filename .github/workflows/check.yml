name: Contributor checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contributor-checks-${{ github.ref }}
  # Superseded PR runs may stop early; main checks verify the merged commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.scope.outputs.go }}
      console: ${{ steps.scope.outputs.console }}
      edge: ${{ steps.scope.outputs.edge }}
      policy: ${{ steps.scope.outputs.policy }}
      terraform: ${{ steps.scope.outputs.terraform }}
      juicefs: ${{ steps.scope.outputs.juicefs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks for the tested merge tree
        id: scope
        env:
          PR_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: python3 scripts/ci-scope.py --base "$PR_BASE"
      - name: Check architecture, API contracts and notice inventories
        run: make check-architecture check-cli-api-contract check-license-notices

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: console/package.json
      - run: make check-go
      - name: Build managed Linux entry points
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/managed-binaries/" ./fire-fuse/runtime/cmd/fire-fuse ./fire-fuse/runtime/cmd/fire-fuse-managed-watchdog

  console:
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cantelop_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CANTELOP_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cantelop_test
      CANTELOP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cantelop_test
      CANTELOP_DATABASE_SSL: disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: console/package.json
      - run: bun install --frozen-lockfile
        working-directory: console
      - name: Initialize disposable databases
        working-directory: console
        run: |
          bun run db:migrate
          bun run observability:db:migrate
      - run: make check-console

  edge:
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: console/package.json
      - run: bun install --frozen-lockfile
        working-directory: edge/workers
      - run: make check-edge

  policy:
    needs: changes
    if: needs.changes.outputs.policy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement scripts/requirements-test.txt
      - run: make check-python
      - if: needs.changes.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.2"
          terraform_wrapper: false
      - if: needs.changes.outputs.terraform == 'true'
        run: make check-platform

  juicefs:
    needs: changes
    # Hosted binary qualification remains in the private operational repository.
    if: needs.changes.outputs.juicefs == 'true' && github.repository_id == '1323478043'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The script pins the upstream revision, source checksum and builder
      # digest, so the patched binary is a pure function of these two files.
      # hashFiles is only available inside steps, not in job-level env.
      - id: inputs
        run: echo "key=${{ hashFiles('storage/juicefs/prepare-juicefs-linux-amd64.sh', 'storage/juicefs/workspace-data-only.patch') }}" >> "$GITHUB_OUTPUT"
      # A hit means these exact inputs already built and passed the policy tests.
      - id: verified
        uses: actions/cache@v4
        with:
          path: dist/juicefs-linux-amd64.build-info
          key: juicefs-verified-linux-amd64-${{ steps.inputs.outputs.key }}
      # The Go build cache is ~900MB; saving it from every PR evicts the whole
      # 10GB repo quota. Only main saves it; PRs restore the nearest one.
      - if: steps.verified.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: dist/.juicefs-build-cache
          key: juicefs-build-linux-amd64-${{ steps.inputs.outputs.key }}
          restore-keys: juicefs-build-linux-amd64-
      - name: Build and test pinned JuiceFS policy
        if: steps.verified.outputs.cache-hit != 'true'
        run: ./storage/juicefs/prepare-juicefs-linux-amd64.sh
      - if: steps.verified.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: dist/.juicefs-build-cache
          key: juicefs-build-linux-amd64-${{ steps.inputs.outputs.key }}

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan reachable Git history with pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        shell: bash
        run: |
          set -euo pipefail
          scanner="$RUNNER_TEMP/cantelop-gitleaks"
          mkdir -p "$scanner"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$scanner/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$scanner/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scanner/gitleaks.tar.gz" -C "$scanner" gitleaks
          python3 scripts/check-secret-scan.py "$scanner/gitleaks"
          "$scanner/gitleaks" git --redact=100 --no-banner --ignore-gitleaks-allow \
            --log-opts="--all --full-history" --gitleaks-ignore-path "$GITHUB_WORKSPACE/.gitleaksignore" \
            "$GITHUB_WORKSPACE"

  # Keep this name stable for branch protection. Job-level conditions let
  # unrelated checks skip without leaving the required result pending.
  check:
    needs: [changes, go, console, edge, policy, juicefs, secrets]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          results = json.loads(os.environ["RESULTS"])
          required = {"changes", "secrets"}
          scope = results["changes"]["outputs"]
          required.update(lane for lane in ("go", "console", "edge", "policy") if scope.get(lane) == "true")
          if scope.get("juicefs") == "true" and os.environ["GITHUB_REPOSITORY_ID"] == "1323478043":
              required.add("juicefs")
          failed = [name for name, job in results.items() if job["result"] not in ("success", "skipped") or (name in required and job["result"] != "success")]
          if failed:
              raise SystemExit("Checks did not succeed: " + ", ".join(failed))
          print("All selected contributor checks passed")
          PYTHON
