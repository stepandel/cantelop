# Rule-scoped, exact fixture lines; global path allowlists would skip whole files.
[extend]
useDefault = true

[[rules]]
id = "cloudflare-api-key"

[[rules.allowlists]]
description = "Reviewed deterministic fixture or documented placeholder"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)console/\.env\.example$''']
regexes = ['''^\s*CLOUDFLARE_OBSERVABILITY_TOKEN=replace\-with\-workers\-observability\-token\s*$''']

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Reviewed deterministic fixture or documented placeholder"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)console/core/db/release\-repository\.test\.mjs$''']
regexes = ['''^\s*const\ apiOperationID\ =\ "op_0123456789abcdef0123456789abcdef";\s*$''']

[[rules.allowlists]]
description = "Reviewed deterministic fixture or documented placeholder"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)fire\-fuse/controlauth/controlauth_test\.go$''']
regexes = ['''^\s*const\ testToken\ =\ "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"\s*$''']

[[rules.allowlists]]
description = "Reviewed deterministic fixture or documented placeholder"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)fire\-fuse/gateway/gateway_test\.go$''']
regexes = ['''^\s*const\ testEdgeToken\ =\ "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"\s*$''']

[[rules.allowlists]]
description = "Reviewed deterministic fixture or documented placeholder"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)platform/ansible/README\.md$''']
regexes = ['''^\s*vault_cantelop_artifact_secret_access_key:\ replace\-with\-r2\-secret\-key\s*$''']
