---
- name: Validate the complete Fire Fuse credential cutover before shutdown
  hosts: fire_fuse_hosts
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1
  roles:
    - role: fire_fuse_control_cutover_preflight
      vars:
        fire_fuse_control_cutover_artifacts:
          - name: fire-fuse service unit
            path: "{{ playbook_dir }}/../../../systemd/compute/fire-fuse.service"
            checksum: ""
          - name: gateway binary
            path: "{{ fire_fuse_gateway_binary_artifact }}"
            checksum: "{{ fire_fuse_gateway_binary_checksum }}"
          - name: dispatcher binary
            path: "{{ fire_fuse_async_dispatcher_binary_artifact }}"
            checksum: "{{ fire_fuse_async_dispatcher_binary_checksum }}"
          - name: gateway service unit
            path: "{{ playbook_dir }}/../../../systemd/compute/fire-fuse-gateway.service"
            checksum: ""
          - name: dispatcher service unit
            path: "{{ playbook_dir }}/../../../systemd/compute/fire-fuse-async-dispatcher.service"
            checksum: ""
          - name: observer binary
            path: "{{ fire_fuse_observer_binary_artifact }}"
            checksum: "{{ fire_fuse_observer_binary_checksum }}"
          - name: observer service unit
            path: "{{ playbook_dir }}/../../../systemd/compute/fire-fuse-observer.service"
            checksum: ""

- name: Validate the builder control worker before shutdown
  hosts: control_builder_hosts
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Validate the builder control worker cutover contract
      ansible.builtin.include_role:
        name: fire_fuse_control_cutover_preflight
        tasks_from: worker
      vars:
        fire_fuse_control_cutover_artifacts:
          - name: control worker binary
            path: "{{ cantelop_control_worker_binary_artifact }}"
            checksum: "{{ cantelop_control_worker_binary_checksum }}"
          - name: control migration binary
            path: "{{ cantelop_control_migrate_artifact }}"
            checksum: "{{ cantelop_control_migrate_checksum }}"
          - name: control migration manifest
            path: "{{ cantelop_control_migrations_artifact }}/SHA256SUMS"
            checksum: "{{ cantelop_control_migrations_manifest_checksum }}"
          - name: control worker service unit
            path: "{{ cantelop_control_worker_unit_source }}"
            checksum: ""

- name: Stop the builder control worker before replacing its compute credential
  hosts: control_builder_hosts
  become: true
  gather_facts: false
  tasks:
    - name: Stop the builder control worker
      ansible.builtin.systemd_service:
        name: cantelop-control-worker.service
        state: stopped

- name: Atomically cut over Fire Fuse host control credentials
  hosts: fire_fuse_hosts
  become: true
  gather_facts: true
  serial: 1
  pre_tasks:
    - name: Inspect services before the coordinated cutover
      ansible.builtin.service_facts:

    - name: Stop and disable credential-dependent services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - fire-fuse-observer.service
        - fire-fuse-gateway.service
        - fire-fuse-async-dispatcher.service
      when: item in ansible_facts.services

    - name: Stop and disable the runtime for credential replacement
      ansible.builtin.systemd_service:
        name: fire-fuse.service
        state: stopped
        enabled: false

  roles:
    - role: fire_fuse_service
    - role: fire_fuse_activate
    - role: fire_fuse_gateway
    - role: fire_fuse_observer

- name: Restart the builder control worker with the dedicated compute credential
  hosts: control_builder_hosts
  become: true
  gather_facts: true
  roles:
    - role: cantelop_control_worker
