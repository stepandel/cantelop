---
- name: Validate private builder tunnel configuration
  ansible.builtin.assert:
    that:
      - cantelop_wireguard_address in ['10.77.0.1', '10.77.0.2']
      - cantelop_wireguard_peer_address in ['10.77.0.1', '10.77.0.2']
      - cantelop_wireguard_address != cantelop_wireguard_peer_address
      - cantelop_wireguard_private_key is match('^[A-Za-z0-9+/]{43}=$')
      - cantelop_wireguard_peer_public_key is match('^[A-Za-z0-9+/]{43}=$')
      - cantelop_wireguard_listen_port | int == 51820
      - >-
        (cantelop_wireguard_address == '10.77.0.1' and cantelop_wireguard_endpoint == '')
        or (cantelop_wireguard_address == '10.77.0.2' and
            cantelop_wireguard_endpoint is match('^[0-9.]+:51820$'))
    fail_msg: WireGuard requires the fixed two-peer tunnel and vault-backed keys
  no_log: true

- name: Install WireGuard
  ansible.builtin.apt:
    name: wireguard
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install private WireGuard peer configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart Cantelop WireGuard

- name: Enable and start WireGuard
  ansible.builtin.systemd_service:
    name: wg-quick@wg0.service
    enabled: true
    state: started
