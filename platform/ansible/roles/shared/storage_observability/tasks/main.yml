---
- name: Validate storage observability inputs
  ansible.builtin.assert:
    that:
      - >-
        storage_observability_redis_bind_address
        is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - storage_observability_redis_port | int >= 1
      - storage_observability_redis_port | int <= 65535
      - storage_observability_redis_password_file.startswith('/')
      - storage_observability_redis_probe.startswith('/')
      - >-
        storage_observability_redis_service
        is match('^[A-Za-z0-9][A-Za-z0-9_.@-]*\.service$')
      - >-
        storage_observability_redis_probe_service
        is match('^[A-Za-z0-9][A-Za-z0-9_.@-]*\.service$')
      - >-
        storage_observability_redis_probe_timer
        is match('^[A-Za-z0-9][A-Za-z0-9_.@-]*\.timer$')
      - >-
        storage_observability_minio_bind_address
        is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - storage_observability_minio_api_port | int >= 1
      - storage_observability_minio_api_port | int <= 65535
      - >-
        storage_observability_minio_user
        is match('^[a-z_][a-z0-9_-]*$')
      - >-
        storage_observability_minio_group
        is match('^[a-z_][a-z0-9_-]*$')
      - storage_observability_minio_data_directory.startswith('/')
      - storage_observability_minio_probe.startswith('/')
      - >-
        storage_observability_minio_service
        is match('^[A-Za-z0-9][A-Za-z0-9_.@-]*\.service$')
      - >-
        storage_observability_minio_probe_service
        is match('^[A-Za-z0-9][A-Za-z0-9_.@-]*\.service$')
      - >-
        storage_observability_minio_probe_timer
        is match('^[A-Za-z0-9][A-Za-z0-9_.@-]*\.timer$')
      - storage_observability_backends_enabled is boolean
      - storage_observability_juicefs_enabled is boolean
      - storage_observability_juicefs_metrics_address == '127.0.0.1'
      - storage_observability_juicefs_metrics_port | int == 9567
      - storage_observability_juicefs_probe.startswith('/')
      - >-
        storage_observability_juicefs_service
        is match('^[A-Za-z0-9][A-Za-z0-9_.@-]*\.service$')
      - >-
        storage_observability_juicefs_probe_service
        is match('^[A-Za-z0-9][A-Za-z0-9_.@-]*\.service$')
      - >-
        storage_observability_juicefs_probe_timer
        is match('^[A-Za-z0-9][A-Za-z0-9_.@-]*\.timer$')
      - >-
        storage_observability_interval
        is match('^[1-9][0-9]*(s|min|h)$')
      - >-
        storage_observability_state_directory
        == '/run/fire-fuse-observability'
    fail_msg: storage observability inputs must be absolute, bounded, and safe

- name: Inspect the installed Redis password
  ansible.builtin.stat:
    path: "{{ storage_observability_redis_password_file }}"
    follow: false
    get_checksum: false
  register: storage_observability_redis_password_status
  when: storage_observability_backends_enabled

- name: Require the trusted Redis password
  ansible.builtin.assert:
    that:
      - >-
        storage_observability_redis_password_status.stat
        is trusted_file(owner='root', group='root', mode='0600')
      - storage_observability_redis_password_status.stat.size == 65
    fail_msg: >-
      the Redis observer requires the trusted root-owned mode-0600 password file
  when:
    - storage_observability_backends_enabled
    - >-
      storage_observability_redis_password_status.stat.exists
      or not ansible_check_mode

- name: Inspect the MinIO data directory
  ansible.builtin.stat:
    path: "{{ storage_observability_minio_data_directory }}"
    follow: false
    get_checksum: false
  register: storage_observability_minio_data_status
  when: storage_observability_backends_enabled

- name: Require the trusted MinIO data directory
  ansible.builtin.assert:
    that:
      - >-
        storage_observability_minio_data_status.stat
        is trusted_directory(
          owner=storage_observability_minio_user,
          group=storage_observability_minio_group,
          mode='0750'
        )
    fail_msg: >-
      the MinIO observer requires the trusted service-owned mode-0750 data
      directory
  when:
    - storage_observability_backends_enabled
    - >-
      storage_observability_minio_data_status.stat.exists
      or not ansible_check_mode

- name: Install the Redis observability probe
  ansible.builtin.template:
    src: observe-redis.sh.j2
    dest: "{{ storage_observability_redis_probe }}"
    owner: root
    group: root
    mode: "0700"
  when: storage_observability_backends_enabled

- name: Create the volatile observability state directory
  ansible.builtin.file:
    path: "{{ storage_observability_state_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the Redis observability service
  ansible.builtin.template:
    src: fire-fuse-observe-redis.service.j2
    dest: >-
      /etc/systemd/system/{{ storage_observability_redis_probe_service }}
    owner: root
    group: root
    mode: "0644"
  notify: Reload storage observability systemd units
  when: storage_observability_backends_enabled

- name: Install the Redis observability timer
  ansible.builtin.template:
    src: fire-fuse-observe-redis.timer.j2
    dest: /etc/systemd/system/{{ storage_observability_redis_probe_timer }}
    owner: root
    group: root
    mode: "0644"
  notify: Reload storage observability systemd units
  when: storage_observability_backends_enabled

- name: Install the MinIO observability probe
  ansible.builtin.template:
    src: observe-minio.sh.j2
    dest: "{{ storage_observability_minio_probe }}"
    owner: root
    group: root
    mode: "0700"
  when: storage_observability_backends_enabled

- name: Install the MinIO observability service
  ansible.builtin.template:
    src: fire-fuse-observe-minio.service.j2
    dest: >-
      /etc/systemd/system/{{ storage_observability_minio_probe_service }}
    owner: root
    group: root
    mode: "0644"
  notify: Reload storage observability systemd units
  when: storage_observability_backends_enabled

- name: Install the MinIO observability timer
  ansible.builtin.template:
    src: fire-fuse-observe-minio.timer.j2
    dest: /etc/systemd/system/{{ storage_observability_minio_probe_timer }}
    owner: root
    group: root
    mode: "0644"
  notify: Reload storage observability systemd units
  when: storage_observability_backends_enabled

- name: Install the JuiceFS observability probe
  ansible.builtin.template:
    src: observe-juicefs.sh.j2
    dest: "{{ storage_observability_juicefs_probe }}"
    owner: root
    group: root
    mode: "0700"
  when: storage_observability_juicefs_enabled

- name: Install the JuiceFS observability service
  ansible.builtin.template:
    src: fire-fuse-observe-juicefs.service.j2
    dest: >-
      /etc/systemd/system/{{ storage_observability_juicefs_probe_service }}
    owner: root
    group: root
    mode: "0644"
  notify: Reload storage observability systemd units
  when: storage_observability_juicefs_enabled

- name: Install the JuiceFS observability timer
  ansible.builtin.template:
    src: fire-fuse-observe-juicefs.timer.j2
    dest: /etc/systemd/system/{{ storage_observability_juicefs_probe_timer }}
    owner: root
    group: root
    mode: "0644"
  notify: Reload storage observability systemd units
  when: storage_observability_juicefs_enabled

- name: Apply storage observability unit changes
  ansible.builtin.meta: flush_handlers

- name: Activate storage observability
  ansible.builtin.include_tasks: activate.yml
  when: not ansible_check_mode
