---
storage_observability_backends_enabled: true
storage_observability_redis_bind_address: 10.78.0.2
storage_observability_redis_port: 6379
storage_observability_redis_password_file: /etc/fire-fuse/redis-password
storage_observability_redis_service: fire-fuse-redis.service
storage_observability_redis_probe: /usr/local/lib/fire-fuse/observe-redis
storage_observability_redis_probe_service: >-
  fire-fuse-observe-redis.service
storage_observability_redis_probe_timer: fire-fuse-observe-redis.timer
storage_observability_minio_bind_address: 10.78.0.2
storage_observability_minio_api_port: 9000
storage_observability_minio_service: fire-fuse-minio.service
storage_observability_minio_user: minio
storage_observability_minio_group: minio
storage_observability_minio_data_directory: /var/lib/fire-fuse/minio
storage_observability_minio_probe: /usr/local/lib/fire-fuse/observe-minio
storage_observability_minio_probe_service: >-
  fire-fuse-observe-minio.service
storage_observability_minio_probe_timer: fire-fuse-observe-minio.timer
storage_observability_juicefs_enabled: false
storage_observability_juicefs_metrics_address: 127.0.0.1
storage_observability_juicefs_metrics_port: 9567
storage_observability_juicefs_service: fire-fuse-juicefs-gateway.service
storage_observability_juicefs_probe: /usr/local/lib/fire-fuse/observe-juicefs
storage_observability_juicefs_probe_service: >-
  fire-fuse-observe-juicefs.service
storage_observability_juicefs_probe_timer: fire-fuse-observe-juicefs.timer
storage_observability_interval: 1min
storage_observability_state_directory: /run/fire-fuse-observability
