storage_backup_write_qualifier: >-
  /usr/local/lib/fire-fuse/qualify-storage-backup-destination-write.py
storage_backup_write_mc_binary: /usr/local/bin/mc
storage_backup_write_mc_checksum: >-
  01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891
storage_backup_write_minimum_retention_days: 14
