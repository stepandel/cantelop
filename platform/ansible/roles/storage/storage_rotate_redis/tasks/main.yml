---
- name: Validate the new Redis rotation credential
  ansible.builtin.assert:
    that:
      - >-
        (redis_metadata_password | default(''))
        is match('^[0-9a-f]{64}$')
    fail_msg: >-
      Redis rotation requires a new 64-character lowercase hexadecimal Vault
      password
  no_log: true

- name: Validate Redis rotation inputs
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      - >-
        storage_rotate_redis_service
        is match('^[A-Za-z0-9][A-Za-z0-9_.@-]*\.service$')
      - >-
        storage_rotate_redis_redis_service
        is match('^[A-Za-z0-9][A-Za-z0-9_.@-]*\.service$')
      - storage_rotate_redis_service == 'fire-fuse.service'
      - storage_rotate_redis_redis_service == 'fire-fuse-redis.service'
      - storage_rotate_redis_password_file == '/etc/fire-fuse/redis-password'
      - >-
        storage_rotate_redis_metadata_url_file
        == '/etc/fire-fuse/juicefs-meta-url'
      - storage_rotate_redis_config_file == '/etc/redis/fire-fuse.conf'
      - storage_rotate_redis_bind_address == '10.78.0.2'
      - storage_rotate_redis_port | int == 6379
      - >-
        (redis_metadata_service | default('fire-fuse-redis.service'))
        == storage_rotate_redis_redis_service
      - >-
        (redis_metadata_consumer_service | default('fire-fuse.service'))
        == storage_rotate_redis_service
      - >-
        (
          redis_metadata_password_file
          | default('/etc/fire-fuse/redis-password')
        )
        == storage_rotate_redis_password_file
      - >-
        (
          redis_metadata_url_file
          | default('/etc/fire-fuse/juicefs-meta-url')
        )
        == storage_rotate_redis_metadata_url_file
      - >-
        (
          redis_metadata_config_file
          | default('/etc/redis/fire-fuse.conf')
        )
        == storage_rotate_redis_config_file
      - >-
        (redis_metadata_bind_address | default('10.78.0.2'))
        == storage_rotate_redis_bind_address
      - >-
        (redis_metadata_port | default(6379) | int)
        == (storage_rotate_redis_port | int)
      - >-
        (
          juicefs_smoke_metadata_url_file
          | default('/etc/fire-fuse/juicefs-meta-url')
        )
        == storage_rotate_redis_metadata_url_file
      - storage_rotate_redis_listen_address == '127.0.0.1'
      - storage_rotate_redis_listen_port | int == 8080
      - storage_rotate_redis_readiness_attempts | int >= 1
      - storage_rotate_redis_readiness_attempts | int <= 120
      - storage_rotate_redis_readiness_delay_seconds | int >= 1
      - storage_rotate_redis_readiness_delay_seconds | int <= 10
    fail_msg: >-
      Redis rotation requires a normal Ansible run, a valid new Vault
      password, fixed trusted paths and services, the loopback API, and bounded
      readiness retries

- name: Inspect Redis rotation files
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
    get_checksum: false
  register: storage_rotate_redis_file_stats
  loop: "{{ storage_rotate_redis_files }}"
  loop_control:
    label: "{{ item.name }}"

- name: Require trusted Redis rotation files
  ansible.builtin.assert:
    that:
      - >-
        item.stat
        is trusted_file(
          owner=item.item.owner,
          group=item.item.group,
          mode=item.item.mode
        )
      - >-
        (
          item.item.exact_size | int > 0
          and
          (item.stat.size | default(0) | int)
          == (item.item.exact_size | int)
        )
        or
        (
          item.item.exact_size | int == 0
          and (item.stat.size | default(0) | int) > 0
        )
    fail_msg: Redis rotation file {{ item.item.name }} failed trust checks
  loop: "{{ storage_rotate_redis_file_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Read Redis rotation rollback files
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  register: storage_rotate_redis_file_backups
  loop: "{{ storage_rotate_redis_files }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Record Redis rollback material
  ansible.builtin.set_fact:
    storage_rotate_redis_old_password_content: >-
      {{ storage_rotate_redis_file_backups.results[0].content | b64decode }}
    storage_rotate_redis_old_metadata_url_content: >-
      {{ storage_rotate_redis_file_backups.results[1].content | b64decode }}
    storage_rotate_redis_old_config_content: >-
      {{ storage_rotate_redis_file_backups.results[2].content | b64decode }}
    storage_rotate_redis_password_changes: >-
      {{
        storage_rotate_redis_file_backups.results[0].content
        | b64decode
        | trim
        != redis_metadata_password
      }}
  no_log: true

- name: Require a new Redis password
  ansible.builtin.assert:
    that:
      - storage_rotate_redis_password_changes | bool
    fail_msg: >-
      explicit Redis rotation requires a Vault password different from the
      currently installed credential

- name: Require exactly one compute host for credential rotation
  ansible.builtin.assert:
    that:
      - groups['fire_fuse_hosts'] | length == 1

- name: Check active compute service before credential rotation
  ansible.builtin.command:
    argv: [/usr/bin/systemctl, is-active, fire-fuse.service]
  delegate_to: "{{ groups['fire_fuse_hosts'][0] }}"
  register: storage_rotate_redis_compute_state
  changed_when: false
  failed_when: storage_rotate_redis_compute_state.rc != 0 or storage_rotate_redis_compute_state.stdout != 'active'

- name: Check enabled compute service before credential rotation
  ansible.builtin.command:
    argv: [/usr/bin/systemctl, is-enabled, fire-fuse.service]
  delegate_to: "{{ groups['fire_fuse_hosts'][0] }}"
  register: storage_rotate_redis_compute_enablement
  changed_when: false
  failed_when: storage_rotate_redis_compute_enablement.rc != 0 or storage_rotate_redis_compute_enablement.stdout != 'enabled'

- name: Read service state before Redis rotation
  ansible.builtin.service_facts:

- name: Require active storage and fire-fuse services
  ansible.builtin.assert:
    that:
      - storage_rotate_redis_compute_state.stdout == 'active'
      - storage_rotate_redis_compute_enablement.stdout == 'enabled'
      - >-
        ansible_facts.services.get(
          storage_rotate_redis_redis_service, {}
        ).get('state', 'not-found') == 'running'
      - >-
        ansible_facts.services.get(
          storage_rotate_redis_redis_service, {}
        ).get('status', 'not-found') == 'enabled'
    fail_msg: >-
      Redis rotation requires fire-fuse and its Redis service to be running and
      enabled before the maintenance window

- name: Require fire-fuse readiness before Redis rotation
  ansible.builtin.uri:
    url: >-
      http://{{ storage_rotate_redis_listen_address }}:{{
      storage_rotate_redis_listen_port }}/readyz
    method: GET
    status_code: 200
    return_content: false
    use_proxy: false
  delegate_to: "{{ groups['fire_fuse_hosts'][0] }}"

- name: Inventory live microVMs before Redis rotation
  ansible.builtin.uri:
    url: >-
      http://{{ storage_rotate_redis_listen_address }}:{{
      storage_rotate_redis_listen_port }}/v1/sandboxes
    method: GET
    status_code: 200
    return_content: true
    use_proxy: false
  delegate_to: "{{ groups['fire_fuse_hosts'][0] }}"
  register: storage_rotate_redis_vm_inventory
  changed_when: false

- name: Require fire-fuse to be drained before Redis rotation
  ansible.builtin.assert:
    that:
      - storage_rotate_redis_vm_inventory.json['items'] is defined
      - >-
        storage_rotate_redis_vm_inventory.json['items']
        | map(attribute='state')
        | difference(['failed', 'terminated'])
        | length == 0
    fail_msg: >-
      Redis rotation refuses to stop fire-fuse while a microVM is starting,
      running, or stopping

- name: Rotate and qualify the Redis credential
  block:
    - name: Stop fire-fuse for Redis rotation
      ansible.builtin.systemd_service:
        name: "{{ storage_rotate_redis_service }}"
        state: stopped
      delegate_to: "{{ groups['fire_fuse_hosts'][0] }}"

    - name: Stop compute workspace exports for credential rotation
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      loop:
        - nfs-kernel-server.service
        - fire-fuse-juicefs-admin.service
        - fire-fuse-juicefs-gateway.service
      delegate_to: "{{ groups['fire_fuse_hosts'][0] }}"

    - name: Verify compute is stopped for credential rotation
      ansible.builtin.include_role:
        name: storage_backup_assert_compute_stopped

    - name: Require no compute JuiceFS mounts for credential rotation
      ansible.builtin.command:
        argv: [/usr/bin/findmnt, --raw, --noheadings, --types, fuse.juicefs,fuse.juicefs-workspace-v1, --output, TARGET]
      delegate_to: "{{ groups['fire_fuse_hosts'][0] }}"
      register: storage_rotate_redis_host_mounts
      changed_when: false
      failed_when: storage_rotate_redis_host_mounts.rc not in [0, 1] or storage_rotate_redis_host_mounts.stdout | trim | length > 0

    - name: Apply the new Redis credential
      ansible.builtin.include_role:
        name: redis_metadata
      vars:
        redis_metadata_allow_password_rotation: true

    - name: Install the new Redis credential on compute
      ansible.builtin.copy:
        content: "META_PASSWORD={{ redis_metadata_password }}\n"
        dest: /etc/fire-fuse/juicefs-gateway.env
        owner: root
        group: root
        mode: "0600"
      delegate_to: "{{ groups['fire_fuse_hosts'][0] }}"
      diff: false
      no_log: true

    - name: Qualify JuiceFS with the new Redis credential
      ansible.builtin.include_role:
        name: juicefs_smoke

    - name: Start fire-fuse after Redis rotation
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
      loop:
        - fire-fuse-juicefs-gateway.service
        - fire-fuse-juicefs-admin.service
        - nfs-kernel-server.service
      delegate_to: "{{ groups['fire_fuse_hosts'][0] }}"

    - name: Start compute after credential rotation
      ansible.builtin.systemd_service:
        name: "{{ storage_rotate_redis_service }}"
        state: started
      delegate_to: "{{ groups['fire_fuse_hosts'][0] }}"

    - name: Require fire-fuse readiness after Redis rotation
      ansible.builtin.uri:
        url: >-
          http://{{ storage_rotate_redis_listen_address }}:{{
          storage_rotate_redis_listen_port }}/readyz
        method: GET
        status_code: 200
        return_content: false
        use_proxy: false
      delegate_to: "{{ groups['fire_fuse_hosts'][0] }}"
      register: storage_rotate_redis_readiness
      retries: "{{ storage_rotate_redis_readiness_attempts }}"
      delay: "{{ storage_rotate_redis_readiness_delay_seconds }}"
      until: storage_rotate_redis_readiness.status | default(0) == 200

  rescue:
    - name: Stop fire-fuse before restoring the Redis credential
      ansible.builtin.systemd_service:
        name: "{{ storage_rotate_redis_service }}"
        state: stopped
      delegate_to: "{{ groups['fire_fuse_hosts'][0] }}"

    - name: Stop compute workspace exports before restoring the Redis credential
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      loop:
        - nfs-kernel-server.service
        - fire-fuse-juicefs-admin.service
        - fire-fuse-juicefs-gateway.service
      delegate_to: "{{ groups['fire_fuse_hosts'][0] }}"

    - name: Verify compute is stopped before restoring the Redis credential
      ansible.builtin.include_role:
        name: storage_backup_assert_compute_stopped

    - name: Restore Redis credential files after failed rotation
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ item.path }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ storage_rotate_redis_password_file }}"
          owner: root
          group: root
          mode: "0600"
          content: "{{ storage_rotate_redis_old_password_content }}"
        - path: "{{ storage_rotate_redis_metadata_url_file }}"
          owner: root
          group: root
          mode: "0600"
          content: "{{ storage_rotate_redis_old_metadata_url_content }}"
        - path: "{{ storage_rotate_redis_config_file }}"
          owner: root
          group: redis
          mode: "0640"
          content: "{{ storage_rotate_redis_old_config_content }}"
      loop_control:
        label: "{{ item.path }}"
      diff: false
      no_log: true

    - name: Restart Redis with the restored credential
      ansible.builtin.systemd_service:
        name: "{{ storage_rotate_redis_redis_service }}"
        state: restarted

    - name: Verify the restored Redis credential
      ansible.builtin.command:
        argv:
          - /usr/bin/redis-cli
          - --no-auth-warning
          - -h
          - "{{ storage_rotate_redis_bind_address }}"
          - -p
          - "{{ storage_rotate_redis_port | string }}"
          - ping
      environment:
        REDISCLI_AUTH: >-
          {{ storage_rotate_redis_old_password_content | trim }}
      register: storage_rotate_redis_rollback_readiness
      changed_when: false
      retries: 10
      delay: 1
      until: storage_rotate_redis_rollback_readiness.stdout == 'PONG'
      no_log: true

    - name: Restore the previous Redis credential on compute
      ansible.builtin.copy:
        content: "META_PASSWORD={{ storage_rotate_redis_old_password_content | trim }}\n"
        dest: /etc/fire-fuse/juicefs-gateway.env
        owner: root
        group: root
        mode: "0600"
      delegate_to: "{{ groups['fire_fuse_hosts'][0] }}"
      diff: false
      no_log: true

    - name: Restore fire-fuse after failed Redis rotation
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
      loop:
        - fire-fuse-juicefs-gateway.service
        - fire-fuse-juicefs-admin.service
        - nfs-kernel-server.service
      delegate_to: "{{ groups['fire_fuse_hosts'][0] }}"

    - name: Start compute after credential rotation
      ansible.builtin.systemd_service:
        name: "{{ storage_rotate_redis_service }}"
        state: started
      delegate_to: "{{ groups['fire_fuse_hosts'][0] }}"

    - name: Require fire-fuse readiness after Redis rollback
      ansible.builtin.uri:
        url: >-
          http://{{ storage_rotate_redis_listen_address }}:{{
          storage_rotate_redis_listen_port }}/readyz
        method: GET
        status_code: 200
        return_content: false
        use_proxy: false
      delegate_to: "{{ groups['fire_fuse_hosts'][0] }}"
      register: storage_rotate_redis_rollback_service_readiness
      retries: "{{ storage_rotate_redis_readiness_attempts }}"
      delay: "{{ storage_rotate_redis_readiness_delay_seconds }}"
      until: >-
        storage_rotate_redis_rollback_service_readiness.status
        | default(0) == 200

    - name: Report rolled-back Redis rotation failure
      ansible.builtin.fail:
        msg: >-
          Redis credential rotation or its qualification failed; the previous
          credential files were restored, Redis accepted the old password, and
          fire-fuse returned to ready
