---
fire_fuse_benchmark_confirm: false
fire_fuse_benchmark_trials: 3
fire_fuse_benchmark_output_directory: ""
fire_fuse_benchmark_service: fire-fuse.service
fire_fuse_benchmark_service_unit: /etc/systemd/system/fire-fuse.service
fire_fuse_benchmark_orchestrator: /usr/local/bin/fire-fuse
fire_fuse_benchmark_config: /etc/fire-fuse/config.json
fire_fuse_benchmark_control_token_file: /etc/fire-fuse/control-clients/operator.token
fire_fuse_benchmark_profile: default
fire_fuse_benchmark_build_id: ""
fire_fuse_benchmark_workspace_prefix: staging-benchmark
fire_fuse_benchmark_ssh_key: ""
fire_fuse_benchmark_ssh_port: 22
fire_fuse_benchmark_runtime_port: 3000
fire_fuse_benchmark_guest_binary: /usr/local/bin/fire-fuse-workspace-benchmark
fire_fuse_benchmark_listen_address: 127.0.0.1
fire_fuse_benchmark_listen_port: 8080
fire_fuse_benchmark_compute_ingress_address: 10.77.0.1
fire_fuse_benchmark_compute_ingress_port: 8084
fire_fuse_benchmark_small_file_count: 1000
fire_fuse_benchmark_dependency_file_count: 5000
fire_fuse_benchmark_sequential_size_mib: 256
fire_fuse_benchmark_concurrency: 3
fire_fuse_benchmark_schedule_delay_seconds: 15
fire_fuse_benchmark_maximum_start_lag_ms: 250
fire_fuse_benchmark_async_timeout_seconds: 120
fire_fuse_benchmark_vcpus: 4
fire_fuse_benchmark_memory_mib: 512
fire_fuse_benchmark_host_result_directory: >-
  /var/lib/fire-fuse/benchmark-results
fire_fuse_benchmark_readiness_attempts: 30
fire_fuse_benchmark_readiness_delay_seconds: 1
