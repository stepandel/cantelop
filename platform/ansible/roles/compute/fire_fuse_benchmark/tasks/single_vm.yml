---
- name: Record the benchmark VM journal search boundary
  ansible.builtin.command:
    argv:
      - /usr/bin/date
      - --utc
      - +%Y-%m-%dT%H:%M:%S.%NZ
  register: fire_fuse_benchmark_start_timestamp
  changed_when: false

- name: Validate the benchmark VM journal search boundary
  ansible.builtin.assert:
    that:
      - >-
        fire_fuse_benchmark_start_timestamp.stdout
        is match(
          '^[0-9]{4}-[0-9]{2}-[0-9]{2}T'
          ~ '[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{9}Z$'
        )
    fail_msg: host did not produce a precise UTC benchmark start timestamp

- name: Create the benchmark VM and measure startup
  ansible.builtin.command:
    argv:
      - /usr/bin/curl
      - --silent
      - --show-error
      - --fail-with-body
      - --config
      - "-"
      - --request
      - POST
      - --header
      - "Content-Type: application/json"
      - --data
      - >-
        {{
          {
            'id': fire_fuse_benchmark_run_id ~ '-single',
            'app_id': fire_fuse_benchmark_app_id,
            'workspace_id': fire_fuse_benchmark_workspace
          }
          | to_json
        }}
      - --write-out
      - "\n__FIRE_FUSE_TIME__:%{time_total}"
      - >-
        http://{{ fire_fuse_benchmark_listen_address }}:{{
        fire_fuse_benchmark_listen_port }}/v1/sandboxes
    stdin: "header = \"Authorization: Bearer {{ fire_fuse_benchmark_control_token }}\""
  register: fire_fuse_benchmark_create_command
  changed_when: true
  no_log: true

- name: Decode the benchmark VM startup result
  ansible.builtin.set_fact:
    fire_fuse_benchmark_create_response: >-
      {{
        fire_fuse_benchmark_create_command.stdout
        | regex_replace(
          '(?s)\n__FIRE_FUSE_TIME__:[0-9.]+$',
          ''
        )
        | from_json
      }}
    fire_fuse_benchmark_startup_duration_ns: >-
      {{
        (
          fire_fuse_benchmark_create_command.stdout
          | regex_search(
            '__FIRE_FUSE_TIME__:([0-9.]+)$',
            '\1'
          )
          | first
          | float
          * 1000000000
        )
        | round
        | int
      }}

- name: Validate the benchmark VM identity
  ansible.builtin.assert:
    that:
      - >-
        fire_fuse_benchmark_create_response.build_id
        == fire_fuse_benchmark_build_id
      - >-
        fire_fuse_benchmark_create_response.profile
        == fire_fuse_benchmark_profile
    fail_msg: benchmark VM did not preserve its requested image and profile

- name: Record the benchmark VM
  ansible.builtin.set_fact:
    fire_fuse_benchmark_vm_id: >-
      {{ fire_fuse_benchmark_create_response.id }}
    fire_fuse_benchmark_vm_ip: >-
      {{ fire_fuse_benchmark_create_response.network.guest_ip }}
    fire_fuse_benchmark_ssh_argv: >-
      {{
        [
          '/usr/bin/ssh',
          '-i',
          fire_fuse_benchmark_ssh_key,
          '-p',
          fire_fuse_benchmark_ssh_port | string,
          '-o',
          'BatchMode=yes',
          '-o',
          'ConnectTimeout=2',
          '-o',
          'GlobalKnownHostsFile=/dev/null',
          '-o',
          'IdentitiesOnly=yes',
          '-o',
          'LogLevel=ERROR',
          '-o',
          'StrictHostKeyChecking=no',
          '-o',
          'UserKnownHostsFile=/dev/null',
          'root@' ~ fire_fuse_benchmark_create_response.network.guest_ip
        ]
      }}

- name: Read the benchmark VM warmup trace
  ansible.builtin.command:
    argv:
      - /usr/bin/journalctl
      - --unit
      - fire-fuse.service
      - --since
      - "{{ fire_fuse_benchmark_start_timestamp.stdout }}"
      - --output
      - cat
      - --no-pager
      - >-
        --grep="msg":"sandbox warmup trace completed".*"sandbox_id":"{{
        fire_fuse_benchmark_vm_id }}"
  register: fire_fuse_benchmark_warmup_trace_command
  changed_when: false
  retries: 10
  delay: 1
  until: >-
    fire_fuse_benchmark_warmup_trace_command.stdout_lines | length == 1

- name: Decode the benchmark VM warmup trace
  ansible.builtin.set_fact:
    fire_fuse_benchmark_warmup_trace_event: >-
      {{
        fire_fuse_benchmark_warmup_trace_command.stdout_lines[0]
        | from_json
      }}

- name: Validate the benchmark VM warmup trace
  ansible.builtin.assert:
    that:
      - >-
        fire_fuse_benchmark_warmup_trace_event.msg
        == 'sandbox warmup trace completed'
      - >-
        fire_fuse_benchmark_warmup_trace_event.sandbox_id
        == fire_fuse_benchmark_vm_id
      - fire_fuse_benchmark_warmup_trace_event.status == 202
      - fire_fuse_benchmark_warmup_trace_event.total_ns | int > 0
      - >-
        fire_fuse_benchmark_warmup_trace_event.steps
        | type_debug == 'list'
      - >-
        fire_fuse_benchmark_warmup_trace_event.steps | length > 0
      - >-
        [
          'host_pool.take_slot',
          'host_pool.hit',
          'jail.bind_selected_container_rootfs',
          'firecracker.load_snapshot',
          'firecracker.patch_container_rootfs',
          'firecracker.resume_snapshot',
          'guest.assign_snapshot'
        ]
        | difference(
          fire_fuse_benchmark_warmup_trace_event.steps
          | map(attribute='name')
          | list
        )
        | length == 0
      - >-
        'host_pool.miss' not in (
          fire_fuse_benchmark_warmup_trace_event.steps
          | map(attribute='name')
          | list
        )
      - >-
        'guest.assign_snapshot' in (
          fire_fuse_benchmark_warmup_trace_event.steps
          | map(attribute='name')
          | list
        )
    fail_msg: service did not emit one valid detailed VM warmup trace

- name: Require benchmark protocol version 2
  ansible.builtin.command:
    argv: >-
      {{
        fire_fuse_benchmark_ssh_argv
        + [fire_fuse_benchmark_guest_binary, 'describe']
      }}
  register: fire_fuse_benchmark_description_command
  changed_when: false
  retries: 30
  delay: 1
  until: fire_fuse_benchmark_description_command.rc == 0

- name: Decode the benchmark protocol description
  ansible.builtin.set_fact:
    fire_fuse_benchmark_description: >-
      {{ fire_fuse_benchmark_description_command.stdout | from_json }}

- name: Validate the benchmark protocol description
  ansible.builtin.assert:
    that:
      - fire_fuse_benchmark_description.schema_version == 2
      - >-
        [
          'small-files',
          'dependency-tree',
          'sequential-write',
          'sequential-read',
          'sequential-read-at',
          'sequential-clean'
        ]
        | difference(
          fire_fuse_benchmark_description.workloads
        )
        | length == 0
    fail_msg: the guest benchmark protocol is missing required workloads

- name: Initialize active guest storage tool identities
  ansible.builtin.set_fact:
    fire_fuse_benchmark_guest_artifacts: []

- name: Hash active guest storage tooling
  ansible.builtin.command:
    argv: >-
      {{
        fire_fuse_benchmark_ssh_argv
        + ['/usr/bin/sha256sum', item.path]
      }}
  loop:
    - name: workspace-benchmark
      path: /usr/local/bin/fire-fuse-workspace-benchmark
  loop_control:
    label: "{{ item.name }}"
  register: fire_fuse_benchmark_guest_artifact_hashes
  changed_when: false

- name: Validate active guest storage tool identities
  ansible.builtin.assert:
    that:
      - >-
        item.stdout
        is match(
          '^[0-9a-f]{64}  '
          ~ (item.item.path | regex_escape)
          ~ '$'
        )
    fail_msg: guest storage tool identity is invalid
  loop: "{{ fire_fuse_benchmark_guest_artifact_hashes.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Record active guest storage tool identities
  ansible.builtin.set_fact:
    fire_fuse_benchmark_guest_artifacts: >-
      {{
        fire_fuse_benchmark_guest_artifacts
        + [
          {
            'name': item.item.name,
            'path': item.item.path,
            'sha256': item.stdout.split()[0]
          }
        ]
      }}
  loop: "{{ fire_fuse_benchmark_guest_artifact_hashes.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Measure small-file creation
  ansible.builtin.command:
    argv: >-
      {{
        fire_fuse_benchmark_ssh_argv
        + [
          fire_fuse_benchmark_guest_binary,
          'small-files',
          fire_fuse_benchmark_small_file_count | string,
          fire_fuse_benchmark_run_id
        ]
      }}
  register: fire_fuse_benchmark_small_files_command
  changed_when: true

- name: Measure dependency-tree materialization
  ansible.builtin.command:
    argv: >-
      {{
        fire_fuse_benchmark_ssh_argv
        + [
          fire_fuse_benchmark_guest_binary,
          'dependency-tree',
          fire_fuse_benchmark_dependency_file_count | string,
          fire_fuse_benchmark_run_id
        ]
      }}
  register: fire_fuse_benchmark_dependency_command
  changed_when: true

- name: Measure sequential writes
  ansible.builtin.command:
    argv: >-
      {{
        fire_fuse_benchmark_ssh_argv
        + [
          fire_fuse_benchmark_guest_binary,
          'sequential-write',
          fire_fuse_benchmark_sequential_size_mib | string,
          fire_fuse_benchmark_run_id
        ]
      }}
  register: fire_fuse_benchmark_sequential_write_command
  changed_when: true

- name: Measure same-VM sequential read
  ansible.builtin.command:
    argv: >-
      {{
        fire_fuse_benchmark_ssh_argv
        + [
          fire_fuse_benchmark_guest_binary,
          'sequential-read',
          fire_fuse_benchmark_sequential_size_mib | string,
          fire_fuse_benchmark_run_id
        ]
      }}
  register: fire_fuse_benchmark_sequential_read_command
  changed_when: false

- name: Terminate the writer VM and measure shutdown
  ansible.builtin.command:
    argv:
      - /usr/bin/curl
      - --silent
      - --show-error
      - --fail-with-body
      - --config
      - "-"
      - --request
      - DELETE
      - --write-out
      - "\n__FIRE_FUSE_TIME__:%{time_total}"
      - >-
        http://{{ fire_fuse_benchmark_listen_address }}:{{
        fire_fuse_benchmark_listen_port }}/v1/sandboxes/{{
        fire_fuse_benchmark_vm_id }}
    stdin: "header = \"Authorization: Bearer {{ fire_fuse_benchmark_control_token }}\""
  register: fire_fuse_benchmark_terminate_command
  changed_when: true
  no_log: true

- name: Decode the benchmark VM shutdown result
  ansible.builtin.set_fact:
    fire_fuse_benchmark_terminate_response: >-
      {{
        fire_fuse_benchmark_terminate_command.stdout
        | regex_replace(
          '(?s)\n__FIRE_FUSE_TIME__:[0-9.]+$',
          ''
        )
        | from_json
      }}
    fire_fuse_benchmark_shutdown_duration_ns: >-
      {{
        (
          fire_fuse_benchmark_terminate_command.stdout
          | regex_search(
            '__FIRE_FUSE_TIME__:([0-9.]+)$',
            '\1'
          )
          | first
          | float
          * 1000000000
        )
        | round
        | int
      }}

- name: Require terminated writer VM state
  ansible.builtin.assert:
    that:
      - fire_fuse_benchmark_terminate_response.state == 'terminated'
    fail_msg: benchmark VM did not terminate cleanly
