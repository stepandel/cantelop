---
- name: Validate Cantelop control worker inputs
  ansible.builtin.assert:
    that:
      - cantelop_control_worker_app_domain is deployment_app_domain
      - cantelop_control_worker_release_gate_origin == 'https://release-gate.' + cantelop_control_worker_app_domain
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version == '24.04'
      - ansible_architecture == 'x86_64'
      - cantelop_control_worker_user == 'cantelop-control'
      - cantelop_control_worker_group == 'cantelop-control'
      - cantelop_control_worker_binary_artifact.startswith('/')
      - cantelop_control_worker_binary_checksum is match('^[0-9a-f]{64}$')
      - cantelop_control_worker_binary == '/usr/local/bin/cantelop-control-worker'
      - cantelop_control_migrate_artifact.startswith('/')
      - cantelop_control_migrate_checksum is match('^[0-9a-f]{64}$')
      - cantelop_control_migrate_binary == '/usr/local/bin/cantelop-control-migrate'
      - cantelop_control_migrations_artifact.startswith('/')
      - cantelop_control_migrations_manifest_checksum is match('^[0-9a-f]{64}$')
      - cantelop_control_migrations_root == '/usr/local/share/cantelop-control/migrations'
      - cantelop_control_migrations_directory == cantelop_control_migrations_root + '/' + cantelop_control_migrations_manifest_checksum
      - cantelop_control_worker_unit_source.startswith('/')
      - cantelop_control_worker_unit == '/etc/systemd/system/cantelop-control-worker.service'
      - cantelop_control_worker_config_directory == '/etc/cantelop-control'
      - cantelop_control_worker_environment_file == '/etc/cantelop-control/worker.env'
      - cantelop_control_worker_database_url is match('^postgres(?:ql)?://[^\r\n ]+$')
      - cantelop_control_worker_database_ssl == 'verify-full'
      - cantelop_control_worker_config_encryption_key is match('^[A-Za-z0-9_-]{43}$')
      - cantelop_control_worker_turso_organization is match('^[a-z0-9][a-z0-9-]{0,62}$')
      - cantelop_control_worker_turso_group is match('^[a-z0-9][a-z0-9-]{0,62}$')
      - cantelop_control_worker_turso_environment is match('^[a-z0-9]{1,16}$')
      - cantelop_control_worker_turso_platform_token is match('^[A-Za-z0-9_.=-]{20,4096}$')
      - cantelop_control_worker_artifact_bucket is match('^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$')
      - cantelop_control_worker_artifact_endpoint is match('^https://[A-Za-z0-9.-]+(?::[0-9]{1,5})?$')
      - cantelop_control_worker_artifact_region is match('^[A-Za-z0-9][A-Za-z0-9-]{0,31}$')
      - cantelop_control_worker_artifact_access_key_id is match('^[A-Za-z0-9_+=/.-]{8,256}$')
      - cantelop_control_worker_artifact_secret_access_key is match('^[A-Za-z0-9_+=/.-]{8,256}$')
      - cantelop_control_worker_id is match('^[A-Za-z0-9][A-Za-z0-9_.:-]{0,63}$')
      - cantelop_control_worker_compute_ingress_url == 'http://10.77.0.1:8084'
      - cantelop_control_worker_compute_control_token is match('^[0-9a-f]{64}$')
      - cantelop_control_worker_cloudflare_account_id is match('^[0-9a-f]{32}$')
      - cantelop_control_worker_cloudflare_dispatch_namespace is match('^[a-z0-9][a-z0-9-]{0,62}$')
      - cantelop_control_worker_cloudflare_route_namespace_id is match('^[0-9a-f]{32}$')
      - cantelop_control_worker_cloudflare_api_token is match('^[A-Za-z0-9_-]{20,512}$')
      - cantelop_control_worker_release_gate_token is match('^[0-9a-f]{64}$')
      - cantelop_control_worker_cloudflare_compatibility_date is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}$')
    fail_msg: >-
      control worker deployment requires a checksum-pinned binary, verified-TLS
      PostgreSQL, private artifact and Cloudflare credentials, and the fixed
      WireGuard Fire Fuse provider boundary
  no_log: true

- name: Inspect Cantelop control worker controller artifacts
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: cantelop_control_worker_controller_artifacts
  loop:
    - name: control worker binary
      path: "{{ cantelop_control_worker_binary_artifact }}"
      checksum: "{{ cantelop_control_worker_binary_checksum }}"
    - name: control migration binary
      path: "{{ cantelop_control_migrate_artifact }}"
      checksum: "{{ cantelop_control_migrate_checksum }}"
    - name: Drizzle migration manifest
      path: "{{ cantelop_control_migrations_artifact }}/SHA256SUMS"
      checksum: "{{ cantelop_control_migrations_manifest_checksum }}"
    - name: systemd unit
      path: "{{ cantelop_control_worker_unit_source }}"
      checksum: ""
  loop_control:
    label: "{{ item.name }}"

- name: Require regular checksum-pinned control worker artifacts
  ansible.builtin.assert:
    that:
      - item.stat is trusted_file
      - >-
        item.item.checksum == ''
        or item.stat.checksum | default('') == item.item.checksum
    fail_msg: >-
      {{ item.item.name }} must be a regular controller file with the declared
      SHA-256 checksum
  loop: "{{ cantelop_control_worker_controller_artifacts.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Inspect the Drizzle migration bundle
  ansible.builtin.stat:
    path: "{{ cantelop_control_migrations_artifact }}"
    follow: false
  delegate_to: localhost
  become: false
  register: cantelop_control_migrations_controller_bundle

- name: Require a regular Drizzle migration bundle directory
  ansible.builtin.assert:
    that:
      - cantelop_control_migrations_controller_bundle.stat is trusted_directory
    fail_msg: >-
      the Drizzle migration bundle must be a regular controller directory

- name: Create Cantelop control worker group
  ansible.builtin.group:
    name: "{{ cantelop_control_worker_group }}"
    system: true

- name: Create Cantelop control worker user
  ansible.builtin.user:
    name: "{{ cantelop_control_worker_user }}"
    group: "{{ cantelop_control_worker_group }}"
    system: true
    create_home: false
    home: /nonexistent
    shell: /usr/sbin/nologin

- name: Create private Cantelop control worker configuration directory
  ansible.builtin.file:
    path: "{{ cantelop_control_worker_config_directory }}"
    state: directory
    owner: root
    group: "{{ cantelop_control_worker_group }}"
    mode: "0750"

- name: Install checksum-pinned Cantelop control worker
  ansible.builtin.copy:
    src: "{{ cantelop_control_worker_binary_artifact }}"
    dest: "{{ cantelop_control_worker_binary }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart Cantelop control worker

- name: Install checksum-pinned Cantelop control migrations
  ansible.builtin.copy:
    src: "{{ cantelop_control_migrate_artifact }}"
    dest: "{{ cantelop_control_migrate_binary }}"
    owner: root
    group: root
    mode: "0755"

- name: Create the immutable Drizzle migration root
  ansible.builtin.file:
    path: "{{ cantelop_control_migrations_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Inspect the installed Drizzle migration manifest
  ansible.builtin.stat:
    path: "{{ cantelop_control_migrations_directory }}/SHA256SUMS"
    follow: false
    checksum_algorithm: sha256
  register: cantelop_control_migrations_installed_manifest

- name: Refuse a changed checksum-addressed migration bundle
  ansible.builtin.assert:
    that:
      - >-
        not (cantelop_control_migrations_installed_manifest.stat.exists | default(false))
        or (
          cantelop_control_migrations_installed_manifest.stat is trusted_file(
            owner='root', group='root'
          )
          and cantelop_control_migrations_installed_manifest.stat.checksum | default('')
            == cantelop_control_migrations_manifest_checksum
        )
    fail_msg: the installed checksum-addressed migration manifest differs from the reviewed artifact

- name: Check the installed Drizzle migration files in place
  ansible.builtin.command:
    argv:
      - /usr/bin/sha256sum
      - --check
      - --quiet
      - SHA256SUMS
    chdir: "{{ cantelop_control_migrations_directory }}"
  register: cantelop_control_migrations_installed_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: cantelop_control_migrations_installed_manifest.stat.exists | default(false)

- name: Install the checksum-addressed Drizzle migration bundle
  ansible.builtin.copy:
    src: "{{ cantelop_control_migrations_artifact }}/"
    dest: "{{ cantelop_control_migrations_directory }}/"
    owner: root
    group: root
    mode: preserve
    directory_mode: "0755"
  when: >-
    not (cantelop_control_migrations_installed_manifest.stat.exists | default(false))
    or cantelop_control_migrations_installed_check.rc | default(1) != 0

- name: Verify every installed Drizzle migration file
  ansible.builtin.command:
    argv:
      - /usr/bin/sha256sum
      - --check
      - SHA256SUMS
    chdir: "{{ cantelop_control_migrations_directory }}"
  changed_when: false

- name: Install private Cantelop control worker environment
  ansible.builtin.copy:
    content: |
      CANTELOP_APP_DOMAIN={{ cantelop_control_worker_app_domain | to_json }}
      RELEASE_GATE_ORIGIN={{ cantelop_control_worker_release_gate_origin | to_json }}
      CANTELOP_DATABASE_URL={{ cantelop_control_worker_database_url | to_json }}
      CANTELOP_DATABASE_SSL={{ cantelop_control_worker_database_ssl | to_json }}
      CANTELOP_CONFIG_ENCRYPTION_KEY={{ cantelop_control_worker_config_encryption_key | to_json }}
      CANTELOP_TURSO_ORGANIZATION={{ cantelop_control_worker_turso_organization | to_json }}
      CANTELOP_TURSO_GROUP={{ cantelop_control_worker_turso_group | to_json }}
      CANTELOP_TURSO_ENVIRONMENT={{ cantelop_control_worker_turso_environment | to_json }}
      CANTELOP_TURSO_PLATFORM_TOKEN={{ cantelop_control_worker_turso_platform_token | to_json }}
      CANTELOP_ARTIFACT_BUCKET={{ cantelop_control_worker_artifact_bucket | to_json }}
      CANTELOP_ARTIFACT_ENDPOINT={{ cantelop_control_worker_artifact_endpoint | to_json }}
      CANTELOP_ARTIFACT_REGION={{ cantelop_control_worker_artifact_region | to_json }}
      CANTELOP_ARTIFACT_ACCESS_KEY_ID={{ cantelop_control_worker_artifact_access_key_id | to_json }}
      CANTELOP_ARTIFACT_SECRET_ACCESS_KEY={{ cantelop_control_worker_artifact_secret_access_key | to_json }}
      CANTELOP_OPERATION_WORKER_ID={{ cantelop_control_worker_id | to_json }}
      CANTELOP_COMPUTE_INGRESS_URL={{ cantelop_control_worker_compute_ingress_url | to_json }}
      CANTELOP_COMPUTE_CONTROL_TOKEN={{ cantelop_control_worker_compute_control_token | to_json }}
      CLOUDFLARE_ACCOUNT_ID={{ cantelop_control_worker_cloudflare_account_id | to_json }}
      CLOUDFLARE_DISPATCH_NAMESPACE={{ cantelop_control_worker_cloudflare_dispatch_namespace | to_json }}
      CLOUDFLARE_ROUTE_NAMESPACE_ID={{ cantelop_control_worker_cloudflare_route_namespace_id | to_json }}
      CLOUDFLARE_API_TOKEN={{ cantelop_control_worker_cloudflare_api_token | to_json }}
      RELEASE_GATE_TOKEN={{ cantelop_control_worker_release_gate_token | to_json }}
      CLOUDFLARE_COMPATIBILITY_DATE={{ cantelop_control_worker_cloudflare_compatibility_date | to_json }}
    dest: "{{ cantelop_control_worker_environment_file }}"
    owner: root
    group: "{{ cantelop_control_worker_group }}"
    mode: "0640"
  diff: false
  no_log: true
  notify: Restart Cantelop control worker

- name: Install Cantelop control worker systemd unit
  ansible.builtin.copy:
    src: "{{ cantelop_control_worker_unit_source }}"
    dest: "{{ cantelop_control_worker_unit }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Cantelop control worker

- name: Reload systemd for Cantelop control worker validation
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode

- name: Validate Cantelop control worker systemd unit
  ansible.builtin.command:
    argv:
      - /usr/bin/systemd-analyze
      - verify
      - "{{ cantelop_control_worker_unit }}"
  changed_when: false
  when: not ansible_check_mode

- name: Apply serialized Cantelop control database migrations
  ansible.builtin.command:
    argv:
      - "{{ cantelop_control_migrate_binary }}"
  become: true
  become_user: "{{ cantelop_control_worker_user }}"
  environment:
    CANTELOP_DATABASE_URL: "{{ cantelop_control_worker_database_url }}"
    CANTELOP_DATABASE_SSL: "{{ cantelop_control_worker_database_ssl }}"
    CANTELOP_MIGRATIONS_PATH: "{{ cantelop_control_migrations_directory }}/drizzle"
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Apply Cantelop control worker configuration changes
  ansible.builtin.meta: flush_handlers
  when: not ansible_check_mode

- name: Enable and start Cantelop control worker
  ansible.builtin.systemd_service:
    name: cantelop-control-worker.service
    state: started
    enabled: true
  when: not ansible_check_mode

- name: Require authenticated Fire Fuse compute ingress health
  ansible.builtin.uri:
    url: "{{ cantelop_control_worker_compute_ingress_url }}/healthz"
    method: GET
    headers:
      Authorization: "Bearer {{ cantelop_control_worker_compute_control_token }}"
    status_code: 200
    return_content: true
    use_proxy: false
  register: cantelop_control_worker_compute_health
  retries: 20
  delay: 1
  until:
    - cantelop_control_worker_compute_health.status == 200
    - cantelop_control_worker_compute_health.json.status == 'ok'
  no_log: true
  when: not ansible_check_mode

- name: Require active Cantelop control worker
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - is-active
      - cantelop-control-worker.service
  register: cantelop_control_worker_active
  changed_when: false
  retries: 10
  delay: 1
  until: cantelop_control_worker_active.stdout == 'active'
  when: not ansible_check_mode
